<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HonEx - Warning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #1a0a0a;
      color: #ffe5e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      max-width: 560px;
      width: 100%;
      background: #2d1111;
      border: 1px solid #4a1a1a;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #dc2626;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
      font-weight: 800;
      color: #fff;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fca5a5;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #9f7a7a;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .url-box {
      background: #1a0a0a;
      border: 1px solid #3a1a1a;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 24px;
      word-break: break-all;
      font-size: 13px;
      color: #fca5a5;
      font-weight: 500;
    }
    .score-bar {
      margin-bottom: 28px;
    }
    .score-label {
      font-size: 12px;
      color: #9f7a7a;
      margin-bottom: 6px;
    }
    .score-track {
      height: 8px;
      background: #1a0a0a;
      border-radius: 4px;
      overflow: hidden;
    }
    .score-fill {
      height: 100%;
      background: linear-gradient(90deg, #dc2626, #ef4444);
      border-radius: 4px;
      transition: width 0.6s ease;
    }
    .score-text {
      font-size: 13px;
      font-weight: 600;
      color: #fca5a5;
      margin-top: 6px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      border: none;
      font-family: inherit;
    }
    .btn-back {
      background: #3a1a1a;
      color: #fca5a5;
    }
    .btn-back:hover {
      background: #4a2a2a;
    }
    .btn-continue {
      background: transparent;
      color: #7a5a5a;
      border: 1px solid #3a1a1a;
    }
    .btn-continue:hover {
      background: #1a0a0a;
      color: #9f7a7a;
    }
    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: #5a3a3a;
    }
    #error {
      color: #fca5a5;
      font-size: 13px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">!</div>
    <h1>Potential Phishing Website Detected</h1>
    <p class="subtitle">HonEx's AI model analyzed this URL and found suspicious patterns commonly associated with phishing attacks.</p>

    <div class="url-box" id="targetUrl">Loading...</div>

    <div class="score-bar">
      <div class="score-label">Threat Confidence</div>
      <div class="score-track">
        <div class="score-fill" id="scoreFill" style="width: 0%"></div>
      </div>
      <div class="score-text" id="scoreText">0%</div>
    </div>

    <div id="error" style="display:none"></div>

    <div class="actions">
      <button class="btn btn-back" id="btnBack">Go Back</button>
      <button class="btn btn-continue" id="btnContinue">Continue Anyway</button>
    </div>
    <p class="footer">HonEx - AI Phishing Protection &middot; All analysis is local and private.</p>
  </div>
  <script src="warning.js"></script>
</body>
</html>
